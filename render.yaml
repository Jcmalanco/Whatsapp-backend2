# Blueprint opcional para desplegar en Render con "Infrastructure as Code".
# Render tambien puede detectar el proyecto sin este archivo, creando el
# servicio manualmente y apuntando al Dockerfile.
services:
  - type: web
    name: malanco-corp-backend
    env: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: FRONTEND_URL_RENDER_VERCEL
        sync: false
      - key: FRONTEND_URL_DOMINIO_PROPIO
        sync: false
